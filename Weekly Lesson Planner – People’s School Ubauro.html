<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Weekly Lesson Planner – People’s School Ubauro</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#5b6675;--bd:#d5dbe3;--pr:#1d4f91;--pt:#fff;--wa:#b4231a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181e;--card:#1e242c;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#35404d;--pr:#6aa6ee;--pt:#10151b;--wa:#ff8b80}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.lh{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:3px double #222;background:#fff;color:#000}
.lh img{width:70px;height:70px;border-radius:50%}.lh .t{flex:1;text-align:center}.lh small{display:block;font-size:12px}.lh h1{margin:2px 0;font:900 28px Impact,"Arial Narrow",sans-serif;letter-spacing:1px}
.tabs{display:flex;gap:6px;padding:10px 14px 0}.tabs button{padding:8px 16px;border:1px solid var(--bd);border-bottom:0;border-radius:8px 8px 0 0;background:var(--card);color:var(--tx);cursor:pointer;font:inherit}.tabs .on{background:var(--pr);color:var(--pt)}
main{padding:14px;max-width:1000px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px;font-weight:600}input,select,textarea{width:100%;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}textarea{min-height:52px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.chips{display:flex;flex-wrap:wrap;gap:4px}.chips label{display:inline-flex;gap:4px;align-items:center;margin:0;padding:3px 8px;border:1px solid var(--bd);border-radius:14px;font-weight:400;color:var(--tx);cursor:pointer}.chips input{width:auto}
button.b{padding:7px 12px;border:1px solid var(--pr);background:var(--pr);color:var(--pt);border-radius:6px;cursor:pointer;font:inherit}button.o{background:none;color:var(--pr)}button.x{background:none;border-color:var(--wa);color:var(--wa)}
details{border:1px solid var(--bd);border-radius:8px;margin:8px 0;padding:6px 10px}summary{cursor:pointer;font-weight:600}.row{display:flex;gap:6px;margin:4px 0;align-items:center}.row input,.row select{flex:1}.row .n{flex:0 0 70px}
h2{font-size:17px;margin:14px 0 6px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.wa{color:var(--wa);font-weight:600}.ok{color:#18794e;font-weight:600}table.l{width:100%;border-collapse:collapse}table.l td,table.l th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}.msg{padding:8px;margin:8px 0;border-radius:6px;background:var(--card);border:1px solid var(--bd)}
#pa{display:none;background:#fff;color:#000;font:12px/1.35 Arial,sans-serif;padding:0}#pa .lh{border-bottom:3px double #000}
#pa table{width:100%;border-collapse:collapse;margin:4px 0}#pa td,#pa th{border:1px solid #444;padding:3px 5px;vertical-align:top;text-align:left}#pa th{background:#e5e5e5}#pa h3{margin:8px 0 3px;font-size:14px;background:#222;color:#fff;padding:3px 6px}
#pa .per{margin-bottom:10px}.sig{display:flex;justify-content:space-between;margin-top:50px}.sig div{width:40%;border-top:1px solid #000;text-align:center;padding-top:3px}
@media print{@page{size:A4;margin:10mm}body{background:#fff}.app{display:none!important}#pa{display:block!important}.noprint{display:none!important}}
.pv .app{display:none}.pv #pa{display:block;padding:12px;max-width:900px;margin:auto}

 let h=`<div class="card"><div class="g"><div><label>Teacher name</label><select data-top="teacher">${opt(TE,st.teacher,"Select teacher…")}</select></div><div><label>Date (pick any day of the week)</label><input type="date" data-top="week" value="${E(st.week)}"></div></div></div>`;
 DA.forEach(d=>{h+=`<h2 id="hd${DA.indexOf(d)}">${d}${dt(DA.indexOf(d))}</h2>`;st.days[d].forEach((p,i)=>{const a=`data-d="${d}" data-p="${i}"`;
 h+=`<details open><summary>Period ${p.no||i+1} ${p.subject?"– "+E(p.subject):""} ${p.classes.length?"("+E(p.classes.join(" + "))+")":""}</summary>
 <label>Period no.</label><select ${a} data-f="no">${opt(["01","02","03","04","05","06","07"],p.no)}</select><label>Class(es) – select more than one to merge classes</label>${chips(CL,p.classes,a+' data-f="classes" data-chk="1"')}
 <div class="g"><div><label>Subject</label><select ${a} data-f="subject">${opt(SU,p.subject,"Select…")}</select></div><div><label>Topic</label><input ${a} data-f="topic" value="${E(p.topic)}"></div></div>
 
 <div class="g"><div><label>Educational technology</label><input ${a} data-f="tech" value="${E(p.tech)}"></div></div>
 <label>Measurable SLOs</label>${p.slos.map((s,k)=>`<div class="row"><span class="n">SLO ${k+1}</span><input ${a} data-f="slos" data-i="${k}" value="${E(s)}"><button class="b x" data-act="delslo" data-d="${d}" data-p="${i}" data-i="${k}">✕</button></div>`).join("")}
 <button class="b o" data-act="addslo" ${a}>+ Add SLO</button>
 <label>Resources</label><textarea ${a} data-f="res">${E(p.res)}</textarea>
 <label>30-minute learning sequence <span id="tt-${d}-${i}">${tl(p)}</span></label>
 ${p.seq.map((r,k)=>`<div class="row"><input class="n" type="number" min="1" ${a} data-f="seq" data-i="${k}" data-k="t" value="${E(r.t)}" title="minutes"><input ${a} data-f="seq" data-i="${k}" data-k="a" value="${E(r.a)}" placeholder="Teaching-learning activity"><select ${a} data-f="seq" data-i="${k}" data-k="b">${opt(BL,r.b,"Bloom")}</select><input ${a} data-f="seq" data-i="${k}" data-k="e" value="${E(r.e)}" placeholder="Assessment evidence"><button class="b x" data-act="delrow" data-d="${d}" data-p="${i}" data-i="${k}">✕</button></div>`).join("")}
 <button class="b o" data-act="addrow" ${a}>+ Add row</button>
 
 <label>Offline alternative</label><textarea ${a} data-f="off">${E(p.off)}</textarea>
 <label>Homework</label><textarea ${a} data-f="hw">${E(p.hw)}</textarea>
 
 <div class="bar"><button class="b x" data-act="delp" ${a}>Delete this period</button></div></details>`});
 h+=`<button class="b o" data-act="addp" data-d="${d}">+ Add period on ${d}</button>`});
 h+=`<h2>Remarks</h2><textarea data-top="remarks">${E(st.remarks)}</textarea><div class="bar"><button class="b" data-act="save">Save plan</button><button class="b o" data-act="print">Print weekly plan</button><button class="b x" data-act="new">New blank plan</button></div><div id="m"></div>`;
 const y=document.activeElement&&scrollY;$("#v1").innerHTML=h;}

 <table class="l"><tr><th>Teacher</th><th>Week of (Monday)</th><th>Periods</th><th></th></tr>${r.map(x=>`<tr><td>${E(x.teacher)}</td><td>${E(x.week)}</td><td>${E(x.n)}</td><td>${["open|Open|o","pid|Print|o","del|Delete|x"].map(s=>{const[a,t,c]=s.split("|");return`<button class="b ${c}" data-act="${a}" data-u="${E(x.uid)}" data-id="${E(x.key)}">${t}</button> `}).join("")}</td></tr>`).join("")||`<tr><td colspan=4>No saved plans yet.</td></tr>`}</table></div>`;
 const t=$("#qt");if(t)t.onchange=e=>{q=e.target.value;list()};$("#qd").onchange=e=>{qd=e.target.value;list()};$("#qc").onclick=()=>{q="";qd="";list()}}
const mon=s=>{if(!s)return null;const d=new Date(s+"T00:00"),w=d.getDay();d.setDate(d.getDate()+(w===0?1:1-w));return d},iso=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())},dt=i=>{const m=mon(st.week);if(!m)return"";m.setDate(m.getDate()+i);return " – "+m.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})},msg=(t,w)=>{const m=$("#m");if(m)m.innerHTML=`<div class="msg ${w?"wa":"ok"}">${t}</div>`},sure=(b,k)=>{if(sure.k===k){sure.k=null;return true}sure.k=k;const o=b.textContent;b.textContent="Tap again to confirm";setTimeout(()=>{if(sure.k===k){sure.k=null;b.textContent=o}},4000);return false};
async function saveP(){const uid=st.uid||me;if(!uid)throw new Error("Not signed in");const w=iso(mon(st.week)),key=st.teacher.replace(/\W+/g,"_")+"_"+w,n=DA.reduce((s,d)=>s+st.days[d].length,0);
 await db.doc("plans/"+uid+"/weeks/"+key).set(JSON.parse(JSON.stringify({teacher:st.teacher,week:w,remarks:st.remarks,days:st.days})));
 const r=db.doc("plans/"+uid),s=await r.get(),idx={...((s.exists&&s.data().idx)||{})};idx[key]={teacher:st.teacher,week:w,n};await r.set({uid,idx});st.uid=uid}
async function openP(u,k){const s=await db.doc("plans/"+u+"/weeks/"+k).get();if(!s.exists)return null;const x=JSON.parse(JSON.stringify(s.data()));return{teacher:x.teacher,week:x.week,remarks:x.remarks||"",days:x.days,uid:u}}
async function delP(u,k){await db.doc("plans/"+u+"/weeks/"+k).delete();const r=db.doc("plans/"+u),s=await r.get(),idx={...((s.exists&&s.data().idx)||{})};delete idx[k];await r.set({uid:u,idx})}
function doPrint(){$("#pa").innerHTML=pr()+`<div class="noprint" style="padding:10px;font:14px Arial"><button class="b" onclick="try{print()}catch(e){alert('Please use your browser menu and choose Print')}">Print now</button> <button class="b o" onclick="closePv()">← Back to editing</button><p>If the Print button does nothing, press Ctrl+P, or use the browser menu → Print (on a phone: Share → Print).</p></div>`;document.body.classList.add("pv");scrollTo(0,0)}
function closePv(){document.body.classList.remove("pv");$("#pa").innerHTML=""}
addEventListener("beforeprint",()=>{if(!document.body.classList.contains("pv"))$("#pa").innerHTML=pr()});
addEventListener("afterprint",()=>{if(!document.body.classList.contains("pv"))$("#pa").innerHTML=""});
document.addEventListener("input",e=>{const el=e.target,d=el.dataset;if(d.top){st[d.top]=el.value;if(d.top==="week")DA.forEach((x,i)=>{const h=$("#hd"+i);if(h)h.textContent=x+dt(i)});return}if(!d.f)return;const p=st.days[d.d][+d.p];
 if(d.chk){const a=p[d.f],v=d.val,k=a.indexOf(v);k<0?a.push(v):a.splice(k,1);if(d.f==="classes"){const s=el.closest("details").querySelector("summary");s.textContent=`Period ${p.no||+d.p+1} ${p.subject?"– "+p.subject:""} ${a.length?"("+a.join(" + ")+")":""}`}}
 else if(d.k){p.seq[+d.i][d.k]=el.value;if(d.k==="t")$(`#tt-${d.d}-${d.p}`).innerHTML=tl(p)}
 else if(d.i!==undefined)p[d.f][+d.i]=el.value;else p[d.f]=el.value});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const d=b.dataset,p=d.d&&st.days[d.d][+d.p],a=d.act;
 if(a==="tab"){$("#v1").style.display=d.v==1?"":"none";$("#v2").style.display=d.v==2?"":"none";$("#t1").className=d.v==1?"on":"";$("#t2").className=d.v==2?"on":"";if(d.v==2)list();return}
 if(a==="addp"){const n=np();n.no="0"+Math.min(st.days[d.d].length+1,7);st.days[d.d].push(n)}else if(a==="delp"){if(!sure(b,"dp"+d.d+d.p))return;st.days[d.d].splice(+d.p,1)}
 else if(a==="addslo")p.slos.push("");else if(a==="delslo")p.slos.splice(+d.i,1);else if(a==="addrow")p.seq.push({t:"",a:"",b:"",e:""});else if(a==="delrow")p.seq.splice(+d.i,1);
 else if(a==="new"){if(!sure(b,"new"))return;st=ns()}
 else if(a==="print"){doPrint();return}
 else if(a==="save"){if(!st.teacher||!st.week)return msg("Please select the teacher and the week start date first.",1);
  if(!db)return msg("Saving is not available here. Open this page signed in to claude.ai, or use Print.",1);
  try{await saveP();msg("Plan saved ✓")}catch(x){msg("Could not save: "+E(x.message||x.code),1)}return}
 else if(a==="open"||a==="pid"){try{const x=await openP(d.u,d.id);if(!x){$("#lm").textContent="Could not open this plan.";return}st=x;if(a==="pid"){doPrint();return}form();document.querySelector("#t1").click()}catch(x){$("#lm").textContent="Could not open: "+(x.message||x.code)}return}
 else if(a==="del"){if(!sure(b,"d"+d.u+d.id))return;try{await delP(d.u,d.id)}catch(x){$("#lm").textContent="Could not delete: "+(x.message||x.code)}return}
 const o=document.querySelectorAll("details");const op=[...o].map(x=>x.open);form();document.querySelectorAll("details").forEach((x,i)=>{if(op[i]===false)x.open=false})});
form();
(async()=>{try{db=await claude.use("db");const u=await claude.use("user");if(u){me=await u.id();coord=await u.canEdit()}}catch(e){}
if(db){db.collection("plans").onSnapshot(s=>{saved=[];s.docs.forEach(x=>{const o=x.data()||{};Object.entries(o.idx||{}).forEach(([k,v])=>saved.push({uid:x.id,key:k,teacher:v.teacher,week:v.week,n:v.n}))});saved.sort((a,b)=>b.week.localeCompare(a.week)||a.teacher.localeCompare(b.teacher));if($("#v2").style.display!=="none")list()},()=>{})}})();
</script></body></html>
